# Local n8n with this community node loaded from dist/.
# Sign in at http://localhost:5678 as dev@example.com / Decision1.
# From inside n8n, the System One stand-in is http://systemone:8000.
name: decision-matrix

services:
  systemone:
    image: node:22-alpine
    command: ["node", "/opt/mock/server.mjs"]
    environment:
      PORT: "8000"
    volumes:
      - ./docker/mock-systemone.mjs:/opt/mock/server.mjs:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  n8n:
    image: n8nio/n8n:2.46.3
    entrypoint: ["tini", "--", "/bin/sh", "/opt/decision-matrix/entrypoint.sh"]
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "true"
      GENERIC_TIMEZONE: UTC
      N8N_ENCRYPTION_KEY: decision-matrix-local-dev-key-0001
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_INSTANCE_OWNER_MANAGED_BY_ENV: "true"
      N8N_INSTANCE_OWNER_EMAIL: dev@example.com
      N8N_INSTANCE_OWNER_FIRST_NAME: Dev
      N8N_INSTANCE_OWNER_LAST_NAME: Owner
      # bcrypt of Decision1. Compose turns $$ into $.
      N8N_INSTANCE_OWNER_PASSWORD_HASH: "$$2b$$10$$G0uND4Svv72F3ypRt8hUc.LSnr4wEpask6lxV8caJ3Ff7P8WYzcqa"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/opt/decision-matrix/dist:ro
      - ./docker/community-package.json:/opt/decision-matrix/package.json:ro
      - ./docker/entrypoint.sh:/opt/decision-matrix/entrypoint.sh:ro
    depends_on:
      systemone:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  n8n_data:
